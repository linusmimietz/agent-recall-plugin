name: hermes-recall-plugin
version: 1.0.0
description: "Recall.ai meeting notetaker — schedule a bot into a Zoom/Meet/Teams call, then fetch a speaker-labelled transcript afterwards. Explicit by design: only joins meeting URLs passed in, no calendar scanning."
author: Linus Mimietz
kind: standalone
requires_env:
  - name: RECALL_API_KEY
    description: "Recall.ai API key. Region-scoped — must match RECALL_REGION."
    url: "https://us-east-1.recall.ai/dashboard/developers/api-keys"
    secret: true
  - name: RECALL_REGION
    description: "Recall.ai region: us-east-1, us-west-2, eu-central-1 or ap-northeast-1"
    url: "https://docs.recall.ai/docs/regions"
provides_tools:
  - recall_schedule_bot
  - recall_bot_status
  - recall_list_bots
  - recall_get_transcript
  - recall_cancel_bot
